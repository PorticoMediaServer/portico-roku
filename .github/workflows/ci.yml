name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: {node-version: 24, cache: npm}
      - id: contract-source
        run: |
          server_ref="$(node -p "require('./scripts/contracts.sources.lock.json').server.ref")"
          echo "server_ref=$server_ref" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: PorticoMediaServer/portico-server
          ref: ${{ steps.contract-source.outputs.server_ref }}
          path: .contract-sources/portico-server
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: .contract-sources/portico-server/go.mod
          cache-dependency-path: .contract-sources/portico-server/go.sum
      - run: sudo apt-get update && sudo apt-get install -y imagemagick librsvg2-bin
      - run: npm ci --no-audit --no-fund
      - run: npm run contracts:check
        env:
          PORTICO_SERVER_ROOT: ${{ github.workspace }}/.contract-sources/portico-server
      - run: npm run package:release
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with: {name: portico-roku-sideload, path: artifacts/portico-roku-release.zip, if-no-files-found: error}
