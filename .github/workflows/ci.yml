name: CI

on:
  pull_request:
  push:
    branches: [main, roku-actions-builds]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      # Generated assets and golden fixtures are versioned with the Roku source.
      # Regeneration is an explicit authoring step, never a read of floating sibling branches.
      - name: Static checks
        run: npm run check
      - name: Affected compiled logic plus mandatory identity/session/privacy/transport cases
        env:
          CI_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: python3 scripts/ci-affected.py
