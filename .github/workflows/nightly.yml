name: Nightly
on:
  schedule:
    - cron: '27 4 * * *'
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      # Generated assets and golden fixtures are versioned with the Roku source.
      # Regeneration is an explicit authoring step, never a read of floating sibling branches.
      - name: Static checks
        run: npm run check
      - name: Compiled BrightScript logic tests
        run: npm test
      - name: Compile unsigned sideload ZIP
        run: npm run package
      - name: Verify ZIP and record build provenance
        run: |
          python3 scripts/verify-package.py
          git diff --exit-code

  security:
    uses: ./.github/workflows/security.yml
    with: {nightly: true}

  summary:
    if: ${{ always() }}
    needs: [package, security]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Nightly result
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: printf '%s\n' "$RESULTS" >> "$GITHUB_STEP_SUMMARY"
